[package]
name = "introspect-fmt-macros"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[features]
# Match the runtime opt-in without requiring feature attributes in callers.
nightly = []

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
